name: Unpack zip

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d _unpack
            SRC=$(find _unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
            rm -rf "$SRC/.github"
            cp -a "$SRC"/. .
            rm -rf _unpack "$ZIP"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack project files"
            git push origin HEAD:main
          fi
